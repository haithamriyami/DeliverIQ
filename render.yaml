services:
  - type: web
    name: deliveriq
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: deliveriq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: deliveriq-redis
          property: connectionString
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SENDGRID_DRY_RUN
        value: "true"

  - type: worker
    name: deliveriq-worker
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: node src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: SESSION_SECRET
        fromService:
          type: web
          name: deliveriq
          envVarKey: SESSION_SECRET
      - key: DATABASE_URL
        fromDatabase:
          name: deliveriq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: deliveriq-redis
          property: connectionString
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SENDGRID_DRY_RUN
        value: "true"

  - type: redis
    name: deliveriq-redis
    plan: free
    ipAllowList: []

databases:
  - name: deliveriq-db
    plan: free
    postgresMajorVersion: 16
