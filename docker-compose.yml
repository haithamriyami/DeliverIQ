services:
  postgres:
    image: postgres:16-alpine
    container_name: deliveriq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deliveriq
      POSTGRES_PASSWORD: deliveriq
      POSTGRES_DB: deliveriq
    ports:
      - "5433:5432"
    volumes:
      - deliveriq_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deliveriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - deliveriq_redis:/data
    command: redis-server --appendonly yes

volumes:
  deliveriq_pgdata:
  deliveriq_redis:
